# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []
all-features = false

[[advisories.ignore]]
# RUSTSEC-2024-0436: paste unmaintained (dtolnay archived). Transitive via
# tokenizers 0.22 → spm_precompiled → paste. No safe upgrade until tokenizers
# replaces spm_precompiled.
id = "RUSTSEC-2024-0436"
reason = "paste unmaintained — transitive via tokenizers/spm_precompiled"

# RUSTSEC-2020-0128 and RUSTSEC-2021-0006 are NAME COLLISIONS, not findings. Both
# advisories concern an abandoned crates.io crate called `cache`. The `cache 1.0.9`
# in this lockfile is THIS workspace's own crate at crates/cache -- its lockfile
# entry carries no `source` and no `checksum`, which is what a path dependency
# looks like and what a registry crate never looks like.
#
# Scanners that match on name alone cannot tell the two apart. aletheia's
# .cargo/audit.toml already carries the same pair with the same reasoning, so this
# is a known class rather than a new judgement.
[[advisories.ignore]]
id = "RUSTSEC-2020-0128"
reason = "name collision — `cache` here is this workspace's crates/cache path dependency, not the abandoned crates.io crate"

[[advisories.ignore]]
id = "RUSTSEC-2021-0006"
reason = "name collision — `cache` here is this workspace's crates/cache path dependency, not the abandoned crates.io crate"

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "0BSD",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    # WHY: fleet posture rendering can emit any of the three fleet LicenseRefs.
    # Logismos itself is PolyForm Noncommercial 1.0.0 (see .kanon-license-fingerprint.toml
    # for the repo-local canonical digest); Shield stays allowed for any dependency
    # in the graph still carrying the prior fleet posture.
    "LicenseRef-PolyForm-Shield-1.0.0",
    "LicenseRef-PolyForm-Noncommercial-1.0.0",
    "LicenseRef-Proprietary",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "deny"
# WHY: every internal crates/* member is publish = false at workspace.package
# scope (never shipped to crates.io), so intra-workspace path deps without an
# explicit version requirement are the correct form, not an oversight — cargo-deny
# otherwise treats a versionless path dep as an implicit wildcard and denies it
# (11 workspace members flagged as of 2026-07-16). allow-wildcard-paths exempts
# path deps specifically while still denying a genuine `foo = "*"` registry dep.
allow-wildcard-paths = true
