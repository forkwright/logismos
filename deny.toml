# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []
all-features = false

[[advisories.ignore]]
# RUSTSEC-2024-0436: paste unmaintained (dtolnay archived). Transitive via
# tokenizers 0.22 → spm_precompiled → paste. No safe upgrade until tokenizers
# replaces spm_precompiled.
id = "RUSTSEC-2024-0436"
reason = "paste unmaintained — transitive via tokenizers/spm_precompiled"

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "0BSD",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    # Logismos itself is PolyForm Shield 1.0.0 (source-available, non-compete).
    # See .kanon-license-fingerprint.toml for the repo-local canonical digest.
    "LicenseRef-PolyForm-Shield-1.0.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "deny"
