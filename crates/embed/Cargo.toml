[package]
name = "embed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Sentence-transformer heads and Matryoshka projection; concrete embedding models."
publish = false

[features]
# Preserve the established Stella API and its accelerator-capable graph for
# ordinary embed users. Native Qwen3 retrieval selects only CPU-safe edges.
default = ["stella"]
stella = ["dep:encoders", "dep:kernels", "loader/tensor", "dep:rayon", "dep:taxis"]

[[bench]]
name = "stella_throughput"
path = "benches/stella_throughput.rs"
harness = false
required-features = ["stella"]

[dependencies]
logismos-core = { path = "../core", package = "core" }
decoders = { path = "../decoders" }
encoders = { path = "../encoders", optional = true }
kernels = { workspace = true, default-features = false, optional = true }
loader = { path = "../loader", default-features = false }
rayon = { workspace = true, optional = true }
taxis = { workspace = true, optional = true }
tokenize = { workspace = true }
snafu = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# WHY dev-only: stella_throughput.rs derives its own BenchError with thiserror. The crate's
# sources use snafu; both belong, for different targets.
thiserror = { workspace = true }

[lints]
workspace = true
