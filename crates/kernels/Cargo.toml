[package]
name = "kernels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "HIP kernel launchers + CPU reference implementations used to gate correctness at 1e-3 tolerance."
publish = false

[features]
# Preserve the established launcher API for direct/default `kernels` users.
default = ["gpu"]
# HIP launcher modules, their nested references, and tensor/HIP error vocabulary.
# Standalone cpu_f32, gdn, and causal_conv modules do not require this feature.
gpu = ["dep:hipcore", "dep:taxis"]

[dependencies]
half.workspace = true
hipcore = { workspace = true, optional = true }
matrixmultiply = { workspace = true }
num-traits.workspace = true
quant.workspace = true
snafu.workspace = true
taxis = { workspace = true, optional = true }

[build-dependencies]
quant.workspace = true

[dev-dependencies]
approx.workspace = true
rand.workspace = true

[[example]]
name = "gemm_bench"
path = "examples/gemm_bench.rs"
required-features = ["gpu"]

[[test]]
name = "matmul_parity"
path = "tests/matmul_parity.rs"
required-features = ["gpu"]

[[test]]
name = "op_parity"
path = "tests/op_parity.rs"
required-features = ["gpu"]

[lints]
workspace = true
