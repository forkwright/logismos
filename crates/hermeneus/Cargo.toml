[package]
name = "hermeneus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Private native text execution ownership boundary."
publish = false

[features]
default = []
gpu = [
    "dep:decoders",
    "decoders/gpu",
    "dep:hipcore",
    "dep:kernels",
    "dep:text",
]

[dependencies]
decoders = { path = "../decoders", default-features = false, optional = true }
hipcore = { workspace = true, optional = true }
kernels = { workspace = true, optional = true }
text = { workspace = true, optional = true }

[lints]
workspace = true
