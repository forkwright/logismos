[package]
name = "hermeneus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Private native text execution ownership boundary."
publish = false

[features]
default = []
gpu = [
    "dep:decoders",
    "decoders/gpu",
    "dep:hipcore",
    "dep:kernels",
    "dep:snafu",
    "dep:text",
]

[dependencies]
decoders = { path = "../decoders", default-features = false, optional = true }
hipcore = { workspace = true, optional = true }
kernels = { workspace = true, optional = true }
snafu = { workspace = true, optional = true }
text = { workspace = true, optional = true }

[dev-dependencies]
loader = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
test-fixtures = { path = "../test-fixtures" }
tokenize = { workspace = true }

[lints]
workspace = true
