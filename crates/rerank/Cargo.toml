[package]
name = "rerank"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Cross-encoder reranking with native Qwen3 and ModernBERT CPU implementations."
publish = false

[features]
# WHY: Preserve the established ModernBERT CPU reference as the ordinary
# rerank surface while allowing native Qwen3 CPU consumers to avoid its graph.
default = ["modernbert"]
modernbert = ["dep:encoders", "dep:kernels"]

[dependencies]
decoders = { path = "../decoders" }
encoders = { workspace = true, optional = true }
kernels = { workspace = true, default-features = false, optional = true }
loader = { path = "../loader", default-features = false }
num-traits = { workspace = true }
serde = { workspace = true, features = ["derive"] }
snafu = { workspace = true }
templates = { path = "../templates" }
tokenize = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
test-fixtures = { path = "../test-fixtures" }
transformers = { workspace = true }

[lints]
workspace = true
