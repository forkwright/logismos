name: GPU-denied boundary

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install boundary dependency
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap shellcheck util-linux
      - name: Resolve repository Rust toolchain
        id: rust_toolchain
        run: |
          python3 - <<'PYTHON'
          import os
          import re
          import tomllib
          from pathlib import Path

          config = tomllib.loads(Path('rust-toolchain.toml').read_text(encoding='utf-8'))
          channel = config['toolchain']['channel']
          components = config['toolchain'].get('components', [])
          if re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', channel) is None:
              raise SystemExit('rust-toolchain.toml must pin an exact stable release')
          if any(re.fullmatch(r'[a-z0-9_-]+', item) is None for item in components):
              raise SystemExit('rust-toolchain.toml contains an invalid component')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              print(f'channel={channel}', file=output)
              print(f'components={",".join(components)}', file=output)
          PYTHON
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}
          components: ${{ steps.rust_toolchain.outputs.components }}
      - name: Prove the minimal inspection graph is HIP-free
        shell: bash
        run: |
          set -euo pipefail
          # Include build dependencies: a future build.rs edge could acquire
          # HIP even when the final Rust linkage graph did not name it.
          dependency_graph=$(cargo tree --locked -p bin \
            --edges normal,build --prefix none --format '{p}')
          if printf '%s\n' "$dependency_graph" | \
              grep -Eq '^(hipcore|kernels|taxis) v'; then
            printf '%s\n' 'minimal bin graph unexpectedly contains a HIP dependency' >&2
            printf '%s\n' "$dependency_graph" >&2
            exit 1
          fi
      - name: Check boundary scripts
        run: |
          shellcheck scripts/gpu-denied-runner.sh scripts/gpu-denied-witness.sh \
            scripts/check-hip-build-modes.sh
          python3 - <<'PYTHON'
          from pathlib import Path
          source = Path('scripts/gpu-denied-exec.py').read_text(encoding='utf-8')
          compile(source, 'gpu-denied-exec.py', 'exec')
          PYTHON
      - name: Prove GPU denial and CPU execution
        run: bash scripts/gpu-denied-witness.sh
      - name: Prove explicit HIP build modes
        run: bash scripts/check-hip-build-modes.sh
      - name: Reject malformed HIP code-object metadata
        run: bash scripts/test-hip-code-object-witness.sh

  hip-code-object:
    # Official ROCm 6.4.4 development image, pinned by its linux/amd64
    # manifest digest. This job compiles code only: the witness enters the
    # GPU-denied boundary before invoking Cargo or hipcc.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: rocm/dev-ubuntu-24.04@sha256:31418ac10a3769a71eaef330c07280d1d999d7074621339b8f93c484c35f6078
      options: --security-opt seccomp=unconfined --security-opt apparmor=unconfined
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install GPU-denied boundary dependencies
        run: apt-get update && apt-get install --yes --no-install-recommends bubblewrap python3 util-linux
      - name: Resolve repository Rust toolchain
        id: rust_toolchain
        run: |
          python3 - <<'PYTHON'
          import os
          import re
          import tomllib
          from pathlib import Path

          config = tomllib.loads(Path('rust-toolchain.toml').read_text(encoding='utf-8'))
          channel = config['toolchain']['channel']
          components = config['toolchain'].get('components', [])
          if re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', channel) is None:
              raise SystemExit('rust-toolchain.toml must pin an exact stable release')
          if any(re.fullmatch(r'[a-z0-9_-]+', item) is None for item in components):
              raise SystemExit('rust-toolchain.toml contains an invalid component')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              print(f'channel={channel}', file=output)
              print(f'components={",".join(components)}', file=output)
          PYTHON
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}
          components: ${{ steps.rust_toolchain.outputs.components }}
      - name: Prepare non-root boundary account
        shell: bash
        run: |
          set -euo pipefail
          useradd --create-home --user-group --shell /bin/bash gpu-ci
          ci_home=/home/gpu-ci
          host_cargo_home=${CARGO_HOME:-$HOME/.cargo}
          host_rustup_home=${RUSTUP_HOME:-$HOME/.rustup}
          test -d "$host_cargo_home/bin"
          test -d "$host_rustup_home"
          install -d -m 0755 -o gpu-ci -g gpu-ci \
            "$ci_home/.cargo" "$ci_home/.rustup" "$GITHUB_WORKSPACE/target"
          cp -a -- "$host_cargo_home/bin" "$ci_home/.cargo/bin"
          for cache in registry git; do
            if [[ -d "$host_cargo_home/$cache" ]]; then
              cp -a -- "$host_cargo_home/$cache" "$ci_home/.cargo/$cache"
            fi
          done
          cp -a -- "$host_rustup_home/." "$ci_home/.rustup/"
          chown -R gpu-ci:gpu-ci -- "$ci_home/.cargo" "$ci_home/.rustup" \
            "$GITHUB_WORKSPACE/target"
      - name: Provision locked Rust sources without executing workspace code
        shell: bash
        env:
          PINNED_TOOLCHAIN: ${{ steps.rust_toolchain.outputs.channel }}
        run: |
          set -euo pipefail
          python3 - "$GITHUB_WORKSPACE/Cargo.lock" <<'PYTHON'
          import sys
          import tomllib
          from pathlib import Path

          lock = tomllib.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          allowed = 'registry+https://github.com/rust-lang/crates.io-index'
          unexpected = sorted({
              package['source']
              for package in lock.get('package', [])
              if 'source' in package and package['source'] != allowed
          })
          if unexpected:
              raise SystemExit(f'Cargo.lock contains non-crates.io sources: {unexpected}')
          PYTHON
          cd /tmp
          /usr/bin/setpriv \
            --reuid=gpu-ci --regid=gpu-ci --init-groups --no-new-privs \
            --inh-caps=-all --ambient-caps=-all -- \
            /usr/bin/env -i \
              HOME=/home/gpu-ci USER=gpu-ci LOGNAME=gpu-ci \
              PATH=/home/gpu-ci/.cargo/bin:/usr/bin:/bin \
              CARGO_HOME=/home/gpu-ci/.cargo RUSTUP_HOME=/home/gpu-ci/.rustup \
              RUSTUP_TOOLCHAIN="$PINNED_TOOLCHAIN" \
              /home/gpu-ci/.cargo/bin/cargo fetch --locked \
                --manifest-path "$GITHUB_WORKSPACE/Cargo.toml"
      - name: Compile and inspect HIP code objects without a GPU
        shell: bash
        run: |
          set -euo pipefail
          {
            /usr/bin/setpriv \
              --reuid=gpu-ci --regid=gpu-ci --init-groups --no-new-privs \
              --inh-caps=-all --ambient-caps=-all -- \
              /usr/bin/env -i \
                HOME=/home/gpu-ci USER=gpu-ci LOGNAME=gpu-ci PATH=/usr/bin:/bin \
                /usr/bin/bash --noprofile --norc \
                  "$GITHUB_WORKSPACE/scripts/hip-code-object-witness.sh" </dev/null
          } 2>&1 | /usr/bin/cat
