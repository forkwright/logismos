# WHY(kanon#2522): replaces logismos's standalone trailer-attestation
# workflow — which waived the Gate-Passed check by `github.actor`, the actor
# who caused the CURRENT run rather than the PR's actual author, so a
# maintainer's "Re-run failed jobs" click flipped the waiver on and
# re-armed a bot PR's already-passed check — with the kanon-designed hybrid
# gate. An untrailered PR now falls through to full-gate-build and actually
# COMPILES; no actor-name or branch-name spoofable waiver exists at all
# (closes the class an unmerged branch in this repo proposed reopening by
# OR-ing in `startsWith(github.head_ref, 'release-please')`, which any
# contributor could trigger by naming their own branch `release-please-*`).
#
# WHY hosted in forkwright/.github, not forkwright/kanon: GitHub cannot
# resolve a workflow_call reference into a private repo owned by a personal
# account for other-repo callers — this is the same structural limit every
# other adoption (koinon, heurema, sphragis) hit.
#
# WHY these with: values (cite): .kanon-ci.toml (forge pipeline: fmt, check,
# clippy, nextest — no doctest stage, no kanon-lint stage; `--jobs 8` /
# `--build-jobs 8` / `--test-threads 8` dropped below because that ceiling
# exists only to protect menos from concurrent-build OOM per that file's
# own WHY comment, not applicable to a GH-hosted runner; `--no-fail-fast`
# on nextest is a behavioral choice, not a concurrency cap, so it is kept).
#
# WHY rust_toolchain left empty: rust-toolchain.toml pins channel 1.90 —
# auto-detect applies (fleet convention).
#
# WHY system_packages empty and needs_fleet_repo_token false: no
# `git = "https://github.com/forkwright/..."` dependency anywhere in the
# workspace (grepped directly); workspace deps are pure-Rust crates plus
# safetensors/tokenizers/memmap2/rayon, none of which need apt packages.
#
# NOTE(kernels crate / HIP, watch on the adoption PR): crates/kernels/build.rs
# invokes `hipcc` (ROCm >= 6.4) to compile GPU kernels but falls back to a
# CPU-only, `logismos_no_gpu_kernels`-cfg'd build with a `cargo:warning` when
# hipcc is absent from PATH — by design, so `cargo check` runs on a machine
# without ROCm. GH-hosted ubuntu-latest has no ROCm, so full-gate-build
# exercises that fallback path, not the GPU path the forge-only local gate
# exercises day to day.
#
# WHY doctest_cmd is empty: .kanon-ci.toml's pipeline has no doctest stage —
# mirroring the local gate exactly, not inventing new coverage.
name: Gate Attestation

on:
  pull_request:
    branches: [main]
  # WHY a push trigger and not just pull_request: a squash merge does not
  # carry the source commits' trailers, so no commit on main has a
  # Gate-Passed trailer — check-trailer finds none and routes to
  # full-gate-build, which is the job that actually compiles the workspace.
  # Without this nothing ever builds main, and the first PR to inherit a
  # merged break is what discovers it (forkwright/theatron#235).
  push:
    branches: [main]

permissions:
  contents: read

# WHY no concurrency: block here: hybrid-gate.yml itself already declares
# `concurrency: group: ${{ github.workflow }}-${{ github.ref }}` and its own
# comment states callers must NOT also set a concurrency group with that
# same key, or the shared group self-cancels. logismos's PRIOR file set this
# exact key — dropped here, not carried forward, for that reason.

jobs:
  gate:
    uses: forkwright/.github/.github/workflows/hybrid-gate.yml@main
    with:
      fmt_cmd: "cargo fmt --all -- --check"
      check_cmd: "cargo check --workspace --all-targets"
      clippy_cmd: "cargo clippy --workspace --all-targets -- -D warnings"
      nextest_cmd: "cargo nextest run --workspace --no-fail-fast"
      doctest_cmd: ""
      system_packages: ""
      needs_fleet_repo_token: false
      rust_cache_key: "gate-attestation"
      ai_attribution_check: true
      docs_only_exemption: true
    secrets: inherit
