# WHY: Block merges on known vulnerabilities and license/source/ban
# violations. Runs `cargo audit` (RustSec DB) and `cargo deny check`
# (licenses, sources, bans, advisories) on every PR and daily against main
# so newly-published CVEs against existing deps are caught even when no PR
# is open. See standards/CI.md § Vulnerability scanning.
name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # NOTE: Daily at 05:23 CST (11:23 UTC). Off-peak minute per global
    # rule about avoiding :00/:30 cron schedules.
    - cron: "23 11 * * *"
  workflow_dispatch:

# PROJECT: explicit top-level default deny; job-level permissions grant only what's needed
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories licenses bans sources
          arguments: --all-features

  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: cargo-audit
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version ^0.22
      - name: cargo audit
        run: cargo audit --deny unmaintained --deny unsound --deny yanked

  # WHY the reusable workflow rather than the scanner action: the action's own
  # description recommends it, and warns the action's behaviour may change in a
  # minor patch update. This repo can use it now that Cargo.lock is committed --
  # the scan-args reference a lockfile that must exist on disk after checkout.
  osv-scanner:
    name: osv scanner
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      scan-args: '--config=osv-scanner.toml --lockfile=Cargo.lock'
