[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "1.0.11"
edition = "2024"
rust-version = "1.90"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
publish = false
repository = "https://github.com/forkwright/logismos"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
multiple_crate_versions = "allow"

[workspace.dependencies]
# Tier-1 foundation deps (Phase 1).
half = "2.4"
isa = { path = "crates/isa" }
smallvec = { version = "1.13", features = ["union"] }
thiserror = "2"
snafu = "0.9"
bindgen = "0.72"
num-traits = "0.2"

# Tier-2 infrastructure deps (Phase 2).
# safetensors: upstream reader for the HF safetensors format
# (approved in the Phase-0 dossier as a sovereignty cut; the format
# itself is our API, no reason to reinvent header parsing).
safetensors = "0.8"
# tokenizers: HF tokenizer.json runtime. Approved as a sovereignty
# cut in Phase-0 dossier 02 §tokenize. `default-features = false` strips
# the HTTP hub client, progressbar, and C++ esaxx dep; we keep only the
# onig regex engine (required by BPE pre-tokenizers).
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
# WHY: interpret artifact-owned Jinja templates through a maintained format
# runtime. MiniJinja 2.24 fuel+macros also requires multi_template to compile;
# the text owner uses a private empty template store, never a loader or named
# registration. Syntax support grants no external template-resolution authority.
# Explicit fuel/recursion/output limits do not imply total-memory isolation.
minijinja = { version = "2.24", default-features = false, features = ["builtins", "macros", "multi_template", "serde", "fuel", "json", "adjacent_loop_items", "std_collections"] }
# WHY: artifact templates use Python-style primitive string methods; the
# maintained compatibility adapter supplies those semantics without host I/O.
minijinja-contrib = { version = "2.24", default-features = false, features = ["pycompat"] }
# memmap2: read-only mmap for bulk-tensor files. No alternatives in the
# Rust ecosystem; used only inside loader's safetensors path.
memmap2 = "0.9"
# rustix: descriptor-first filesystem operations at the verified GGUF input
# boundary. `fs` supplies open/mkfifoat and `std` converts its owned descriptor
# and errno into standard Rust I/O types.
rustix = { version = "1.1.4", default-features = false, features = ["fs", "std"] }
# rayon: work-stealing thread pool for CPU parallel matmul (Phase 3
# throughput floor). Single dep, no feature knobs needed.
rayon = "1.10"
# matrixmultiply: pure-Rust autovectorised GEMM (sgemm/dgemm). Used only
# by the Phase-3 CPU reference path; the GPU path in Phase 6 supersedes
# it. `threading` enables internal multi-thread tiling via std::thread.
matrixmultiply = "0.3"

# Sampling and test-only tier-1 deps.
approx = "0.5"
rand = { version = "0.10", default-features = false }
# tempfile: fleet-canonical test-fixture temp dirs (RUST.md "Test fixtures:
# tempfile over /tmp/<hardcoded>", D-057) -- parallel-scope-safe, RAII cleanup.
tempfile = "3"

# Serialization (used by rerank config, brought in by tokenizers/safetensors
# transitively; made explicit for workspace members).
serde = "1.0"
serde_json = "1.0"
# sha2: RustCrypto's maintained SHA-256 implementation. Artifact inspection
# streams whole-file bytes; no handwritten digest implementation is acceptable.
sha2 = { version = "0.11.0", default-features = false }

# Internal crate cross-refs.
hipcore = { path = "crates/hipcore" }
taxis = { path = "crates/taxis" }
# CPU consumers inherit no GPU launcher feature. GPU consumers opt in at their
# own manifest boundary, keeping HIP linkage out of CPU-only dependency graphs.
kernels = { path = "crates/kernels", default-features = false }
praxis = { path = "crates/praxis" }
loader = { path = "crates/loader" }
tokenize = { path = "crates/tokenize" }
cache = { path = "crates/cache" }
decode = { path = "crates/decode" }
core = { path = "crates/core" }
transformers = { path = "crates/transformers" }
encoders = { path = "crates/encoders" }
embed = { path = "crates/embed" }
placement = { path = "crates/placement" }
quant = { path = "crates/quant" }
